[project]
name = "apple-health-analytics"
version = "1.0.0"
description = "Apple Health export → validated daily metrics → Power BI model and an interactive web report"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
