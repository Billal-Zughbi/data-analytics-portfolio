[project]
name = "olist-delivery-experience"
version = "1.0.0"
description = "Late delivery, review scores and where late orders come from, on the Olist public e-commerce dataset"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "duckdb>=1.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
olist-delivery = "olist_delivery.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
